<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clipper Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { width: 100%; height: 100%; padding: 1rem; font-family: 'Inter', sans-serif; box-sizing: border-box; }
        .input-group { margin-bottom: 0.75rem; }
        label { display: block; font-size: 0.75rem; font-weight: 600; color: #4a5568; margin-bottom: 0.25rem; }
        input, textarea { width: 100%; border: 1px solid #cbd5e0; padding: 0.5rem; border-radius: 0.375rem; font-size: 0.875rem; }
        textarea { height: 150px; resize: vertical; font-family: monospace; font-size: 0.75rem; }
        button { width: 100%; padding: 0.75rem; border-radius: 0.375rem; font-weight: 600; color: white; transition: 0.2s; }
        .btn-primary { background-color: #4f46e5; }
        .btn-primary:hover { background-color: #4338ca; }
        .status { margin-top: 0.5rem; text-align: center; font-size: 0.875rem; min-height: 1.25rem; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .reset-link { display: block; text-align: center; margin-top: 1rem; font-size: 0.75rem; color: #a0aec0; text-decoration: underline; cursor: pointer; }
        .reset-link:hover { color: #ef4444; }
    </style>
</head>
<body class="bg-gray-50">
    <h1 class="text-xl font-bold text-gray-800 mb-4">Clipper Configuration</h1>

    <div class="input-group">
        <label for="appPassword">App Password</label>
        <input type="password" id="appPassword" placeholder="Paste UUID from Script Logs">
    </div>

    <div class="input-group">
        <label for="geminiApiKey">Gemini API Key</label>
        <input type="password" id="geminiApiKey" placeholder="AIzaSy...">
    </div>

    <div class="input-group">
        <label for="scriptUrl">Apps Script Web App URL</label>
        <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/...">
    </div>

    <div class="input-group">
        <label for="prompt">Extraction Prompt</label>
        <textarea id="prompt"></textarea>
    </div>

    <button id="saveBtn" class="btn-primary">Save Settings</button>
    <div id="statusMsg" class="status"></div>

    <a id="resetBtn" class="reset-link">Problems? Reset all settings.</a>

    <script src="popup.js"></script>
</body>
</html>
